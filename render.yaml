services:
  - type: web
    name: pachislot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STREAM_PUBLIC_BASE_URL
        value: http://192.168.1.23:8889
      - key: STREAM_NAME
        value: pachislot
